      - "Configure": webflash/site/configure.md
      - "Build": webflash/site/build.md
      - "Flash": webflash/site/flash.md
      - "Embed": webflash/site/embed.md
    - "Flashing methods": webflash/flashing.md
    - "Embedding a card": webflash/embedding.md
