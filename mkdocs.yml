      - "Connector gallery": pinconnect/examples/connector-gallery.md
      - "Jumper settings": pinconnect/examples/jumpers.md
      - "Light and dark": pinconnect/examples/light-dark.md
    - "Open the designer": "https://pinconnect.isiks.tech"
    - "GitHub Repository": "https://github.com/xbst/PinConnect"
  - 3DStep:
